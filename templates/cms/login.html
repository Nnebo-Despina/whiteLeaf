{% load static site_tags %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in — White Leaf Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-display: "Fraunces", sans-serif;
        --font-body: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="font-body bg-[#E9E4D6] text-[#241F18] antialiased min-h-screen flex items-center justify-center p-6">
    <form method="post" class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-xl">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />
      <div class="flex items-center gap-2.5">
          <img src={% static 'img/favicon.svg' %} alt={{ hotel.name }} class="w-9 h-9">
          <span class="font-display text-lg">White Leaf</span>
      </div>
      {% comment %} <h1 class="font-display text-2xl mt-6">Administrator sign in</h1> {% endcomment %}
      <input
        name="username"
        type="text"
        autocomplete="username"
        autofocus
        placeholder="Username"
        required
        value="{{ form.username.value|default:'' }}"
        class="mt-5 w-full bg-[#F4F0E4] rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#c6a15b]/50"
      />
      <input
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
        required
        class="mt-3 w-full bg-[#F4F0E4] rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-[#c6a15b]/50"
      />
      {% if form.errors %}
      <p class="text-xs text-[#b3573a] mt-2">Username or password is incorrect.</p>
      {% endif %}
      <button
        type="submit"
        class="mt-5 w-full bg-[#16302A] text-white text-sm font-medium py-3 rounded-full hover:bg-[#1F4A3D] transition-colors"
      >
        Sign in
      </button>
    </form>
  </body>
</html>
